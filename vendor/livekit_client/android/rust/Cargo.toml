[workspace]
resolver = "2"
exclude = ["vendor/tract-linalg-0.19.16"]

[package]
name = "deep_filter_android_native"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[profile.dev]
debug-assertions = false
overflow-checks = false
debug = "none"
opt-level = 2

# Deliberately not "panic = abort": lib.rs wraps every JNI-exported function
# in catch_unwind so a rare internal panic degrades to "skip this frame"
# instead of crashing the whole app mid-call over an optional enhancement -
# that only works with unwinding enabled.

[dependencies]
jni = { version = "0.21", default-features = false }
# Same pin as fluxer_desktop's native/webrtc-sender crate (deep_filter.rs):
# the crates.io release of deep_filter (0.2.5, 2022) predates DFN3, so this
# pins to the exact upstream rev the bundled DFN3 ONNX model was built from.
# tract + default-model runs that bundled model (~2 MB, embedded into the
# .so) on the pure-Rust tract inference engine - no libc++/NDK STL needed.
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet", rev = "978576aa8400552a4ce9730838c635aa30db5e61", default-features = false, features = [
    "tract",
    "default-model",
] }
# deep_filter declares tract ^0.19.4; newer releases in that range regress
# DFN3 model codegen (fails with "duplicate name .../Conv.bias" on the
# transposed convolutions). These direct-but-otherwise-unused dependencies
# force the resolver to pin deep_filter's whole tract subtree to 0.19.16 -
# the version in upstream deep_filter's own v0.5.6 lockfile - since tract's
# internal `=` pins drag tract-core/hir/data/linalg along with whichever of
# these two entry points get resolved. Same pins as desktop's deep_filter.rs.
tract-onnx = "=0.19.16"
tract-pulse = "=0.19.16"
# Pinned to the 0.15 family to match deep_filter's public API surface
# (DfTract::process takes ndarray 0.15 ArrayView2 arguments).
ndarray = "0.15"

[patch.crates-io]
tract-linalg = { path = "vendor/tract-linalg-0.19.16" }
